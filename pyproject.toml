[project]
name = "project-ahon"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "requests==2.32.5",
    "huggingface_hub==2.2.0",
    "beautifulsoup4==4.14.3",
    "lxml==6.1.3",
    "sqlparse==0.5.3"
]

[tool.ruff]
builtins = ["spark", "dbutils", "display"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["EXE002"]

[tool.ruff.lint.per-file-ignores]
"src/sql/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
"src/sql/datasets/psa_psgc/bronze/psa_psgc.py" = ["F821"]
"src/sql/datasets/psa_psgc/extract/psa_psgc_ingest.py" = ["F821"]
"src/sql/datasets/psa_psgc/lgu_master.py" = ["F821"]
"src/sql/06_reference/load_lgu_master.py" = ["F821"]
"src/sql/gold/dim_lgu.py" = ["F821"]
"src/sql/datasets/psa_psgc/silver/psa_psgc_clean.py" = ["F821"]
"src/sql/gold/fact_population.py" = ["F821"]
