resources:
  jobs:
    cmci:
      name: ahon_cmci
      description: AHON bounded batch processing; see source-to-target matrix
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 14400
      performance_target: STANDARD
      tags:
        project: ahon
        aidevkit_project: ai-dev-kit
      environments:
      - environment_key: pipeline
        spec:
          environment_version: '6'
          dependencies:
          - openpyxl==3.1.5
          - pandas==2.3.3
          - requests==2.32.5
          - huggingface_hub==2.2.0
          - lxml==6.1.3
          - beautifulsoup4==4.14.3
          - sqlparse==0.5.3
      tasks:
      - task_key: extract
        spark_python_task:
          python_file: ../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/datasets/cmci/pipeline.py
          - --catalog
          - ${var.catalog}
          - --source-volume
          - ${var.source_volume}
          - --batch-id
          - '{{job.run_id}}'
          - --stage
          - extract
          - --mapping-file
          - ${var.cmci_mapping_file}
          - --source-period
          - ${var.source_period}
          - --start-year
          - '{{job.parameters.start_year}}'
          - --end-year
          - '{{job.parameters.end_year}}'
        environment_key: pipeline
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 30000
        retry_on_timeout: false
      - task_key: bronze
        spark_python_task:
          python_file: ../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/datasets/cmci/pipeline.py
          - --catalog
          - ${var.catalog}
          - --source-volume
          - ${var.source_volume}
          - --batch-id
          - '{{job.run_id}}'
          - --stage
          - bronze
          - --mapping-file
          - ${var.cmci_mapping_file}
          - --source-period
          - ${var.source_period}
          - --start-year
          - '{{job.parameters.start_year}}'
          - --end-year
          - '{{job.parameters.end_year}}'
        environment_key: pipeline
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 30000
        retry_on_timeout: false
        depends_on:
        - task_key: extract
      - task_key: silver
        spark_python_task:
          python_file: ../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/datasets/cmci/pipeline.py
          - --catalog
          - ${var.catalog}
          - --source-volume
          - ${var.source_volume}
          - --batch-id
          - '{{job.run_id}}'
          - --stage
          - silver
          - --mapping-file
          - ${var.cmci_mapping_file}
          - --source-period
          - ${var.source_period}
          - --start-year
          - '{{job.parameters.start_year}}'
          - --end-year
          - '{{job.parameters.end_year}}'
        environment_key: pipeline
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 30000
        retry_on_timeout: false
        depends_on:
        - task_key: bronze
      - task_key: gold
        spark_python_task:
          python_file: ../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/datasets/cmci/pipeline.py
          - --catalog
          - ${var.catalog}
          - --source-volume
          - ${var.source_volume}
          - --batch-id
          - '{{job.run_id}}'
          - --stage
          - gold
          - --mapping-file
          - ${var.cmci_mapping_file}
          - --source-period
          - ${var.source_period}
          - --start-year
          - '{{job.parameters.start_year}}'
          - --end-year
          - '{{job.parameters.end_year}}'
        environment_key: pipeline
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 30000
        retry_on_timeout: false
        depends_on:
        - task_key: silver
      - task_key: platinum
        spark_python_task:
          python_file: ../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/datasets/cmci/pipeline.py
          - --catalog
          - ${var.catalog}
          - --source-volume
          - ${var.source_volume}
          - --batch-id
          - '{{job.run_id}}'
          - --stage
          - platinum
          - --mapping-file
          - ${var.cmci_mapping_file}
          - --source-period
          - ${var.source_period}
          - --start-year
          - '{{job.parameters.start_year}}'
          - --end-year
          - '{{job.parameters.end_year}}'
        environment_key: pipeline
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 30000
        retry_on_timeout: false
        depends_on:
        - task_key: gold
      - task_key: run_accounting
        depends_on:
        - task_key: platinum
        run_if: ALL_DONE
        environment_key: pipeline
        timeout_seconds: 600
        max_retries: 1
        min_retry_interval_millis: 30000
        spark_python_task:
          python_file: ../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/monitoring/finalize_run.py
          - --catalog
          - ${var.catalog}
          - --run-id
          - '{{job.run_id}}'
          - --task-key
          - ahon_cmci
          - --status
          - '{{tasks.platinum.result_state}}'
      permissions:
      - user_name: ${var.run_as_user}
        level: CAN_MANAGE
      schedule:
        quartz_cron_expression: 0 0 8 15 2 ?
        timezone_id: Asia/Manila
        pause_status: PAUSED
      parameters:
      - name: start_year
        default: '2014'
      - name: end_year
        default: '2024'
