resources:
  jobs:
    ldrrmf:
      name: ahon_ldrrmf
      description: AHON bounded batch processing; see source-to-target matrix
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 14400
      performance_target: STANDARD
      tags:
        project: ahon
        aidevkit_project: ai-dev-kit
      environments:
      - environment_key: pipeline
        spec:
          environment_version: '6'
          dependencies:
          - openpyxl==3.1.5
          - pandas==2.3.3
          - requests==2.32.5
          - huggingface_hub==2.2.0
          - lxml==6.1.3
          - beautifulsoup4==4.14.3
          - sqlparse==0.5.3
      tasks:
      - task_key: extract
        spark_python_task:
          python_file: ../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/datasets/blgf_ldrrmf_annual_lgu/extract/extract_blgf_ldrrmf_annual_lgu.py
          - --catalog
          - ${var.catalog}
          - --source-volume
          - ${var.source_volume}
          - --batch-id
          - '{{job.run_id}}'
          - --hf-repo
          - ${var.hf_repo}
          - --hf-revision
          - ${var.hf_revision}
        environment_key: pipeline
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 30000
        retry_on_timeout: false
      - task_key: bronze
        spark_python_task:
          python_file: ../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/datasets/blgf_ldrrmf_annual_lgu/bronze/load_blgf_ldrrmf_annual_lgu.py
          - --catalog
          - ${var.catalog}
          - --source-volume
          - ${var.source_volume}
          - --batch-id
          - '{{job.run_id}}'
        environment_key: pipeline
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 30000
        retry_on_timeout: false
        depends_on:
        - task_key: extract
      - task_key: mapping
        spark_python_task:
          python_file: ../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/common/run_python.py
          - --catalog
          - ${var.catalog}
          - --source-volume
          - ${var.source_volume}
          - --batch-id
          - '{{job.run_id}}'
          - --file
          - src/sql/datasets/blgf_ldrrmf_annual_lgu/silver/build_blgf_ldrrmf_lgu_map.py
          - --source-period
          - ${var.source_period}
        environment_key: pipeline
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 30000
        retry_on_timeout: false
        depends_on:
        - task_key: bronze
      - task_key: silver
        spark_python_task:
          python_file: ../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/common/run_sql.py
          - --catalog
          - ${var.catalog}
          - --source-volume
          - ${var.source_volume}
          - --batch-id
          - '{{job.run_id}}'
          - --file
          - src/sql/datasets/blgf_ldrrmf_annual_lgu/silver/clean_blgf_ldrrmf_annual_lgu.sql
        environment_key: pipeline
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 30000
        retry_on_timeout: false
        depends_on:
        - task_key: mapping
      - task_key: gold
        spark_python_task:
          python_file: ../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/common/run_sql.py
          - --catalog
          - ${var.catalog}
          - --source-volume
          - ${var.source_volume}
          - --batch-id
          - '{{job.run_id}}'
          - --file
          - src/sql/gold/build_fact_ldrrmf.sql
        environment_key: pipeline
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 30000
        retry_on_timeout: false
        depends_on:
        - task_key: silver
      - task_key: run_accounting
        depends_on:
        - task_key: gold
        run_if: ALL_DONE
        environment_key: pipeline
        timeout_seconds: 600
        max_retries: 1
        min_retry_interval_millis: 30000
        spark_python_task:
          python_file: ../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/monitoring/finalize_run.py
          - --catalog
          - ${var.catalog}
          - --run-id
          - '{{job.run_id}}'
          - --task-key
          - ahon_ldrrmf
          - --status
          - '{{tasks.gold.result_state}}'
      permissions:
      - user_name: ${var.run_as_user}
        level: CAN_MANAGE
      schedule:
        quartz_cron_expression: 0 0 8 1 * ?
        timezone_id: Asia/Manila
        pause_status: PAUSED
