resources:
  jobs:
    ahon_pipeline:
      name: ${bundle.name}_pipeline
      max_concurrent_runs: ${var.max_concurrent_runs}
      timeout_seconds: ${var.job_timeout_seconds}
      performance_target: STANDARD
      tags:
        project: ${bundle.name}
        aidevkit_project: ai-dev-kit
      queue:
        enabled: true
      parameters:
      - name: batch_id
        default: '{{job.run_id}}'
      - name: catalog
        default: ${var.catalog}
      environments:
      - environment_key: core
        spec:
          environment_version: ${var.environment_version}
          dependencies:
          - sqlparse==0.5.3
          - great_expectations==1.24.0
          - pandas==2.3.3
      - environment_key: psgc
        spec:
          environment_version: ${var.environment_version}
          dependencies:
          - requests==2.32.5
          - great_expectations==1.24.0
          - pandas==2.3.3
      - environment_key: files
        spec:
          environment_version: ${var.environment_version}
          dependencies:
          - pandas==2.3.3
          - openpyxl==3.1.5
          - huggingface_hub==2.2.0
          - great_expectations==1.24.0
      - environment_key: population
        spec:
          environment_version: ${var.environment_version}
          dependencies:
          - requests==2.32.5
          - great_expectations==1.24.0
          - pandas==2.3.3
      - environment_key: earthquake
        spec:
          environment_version: ${var.environment_version}
          dependencies:
          - pandas==2.3.3
          - requests==2.32.5
          - lxml==6.1.3
          - great_expectations==1.24.0
      - environment_key: cmci
        spec:
          environment_version: ${var.environment_version}
          dependencies:
          - beautifulsoup4==4.14.3
          - requests==2.32.5
          - great_expectations==1.24.0
          - pandas==2.3.3
      - environment_key: osm
        spec:
          environment_version: ${var.environment_version}
          dependencies:
          - geopandas==1.1.1
          - pyogrio==0.11.1
          - shapely==2.1.2
          - pyproj==3.7.0
          - huggingface_hub==2.2.0
          - great_expectations==1.24.0
          - pandas==2.3.3
      tasks:
      - task_key: setup
        spark_python_task:
          python_file: ../../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/common/run_sql.py
          - --catalog
          - '{{job.parameters.catalog}}'
          - --source-volume
          - ${var.source_volume}
          - --batch-id
          - '{{job.parameters.batch_id}}'
          - --file
          - src/sql/00_setup/00_catalog_schema_setup.sql
        environment_key: core
        timeout_seconds: ${var.task_timeout_seconds}
        max_retries: ${var.task_retries}
        min_retry_interval_millis: ${var.retry_interval_millis}
        retry_on_timeout: false
        run_if: ALL_SUCCESS
      - task_key: psgc_extract
        spark_python_task:
          python_file: ../../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/datasets/psa_psgc/extract/psa_psgc_ingest.py
          - --catalog
          - '{{job.parameters.catalog}}'
          - --source-volume
          - ${var.source_volume}
          - --batch-id
          - '{{job.parameters.batch_id}}'
          - --secret-scope
          - ${var.psgc_secret_scope}
          - --secret-key
          - ${var.psgc_secret_key}
          - --api-base-url
          - ${var.psgc_api_base_url}
          - --expected-rows
          - ${var.psgc_expected_rows}
          - --request-timeout
          - ${var.request_timeout}
        environment_key: psgc
        timeout_seconds: ${var.task_timeout_seconds}
        max_retries: ${var.task_retries}
        min_retry_interval_millis: ${var.retry_interval_millis}
        retry_on_timeout: false
        run_if: ALL_SUCCESS
        depends_on:
        - task_key: setup
      - task_key: psgc_bronze
        spark_python_task:
          python_file: ../../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/datasets/psa_psgc/bronze/psa_psgc.py
          - --catalog
