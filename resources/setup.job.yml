resources:
  jobs:
    setup:
      name: ahon_setup
      description: AHON bounded batch processing; see source-to-target matrix
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 14400
      performance_target: STANDARD
      tags:
        project: ahon
        aidevkit_project: ai-dev-kit
      environments:
      - environment_key: pipeline
        spec:
          environment_version: '6'
          dependencies:
          - openpyxl==3.1.5
          - pandas==2.3.3
          - requests==2.32.5
          - huggingface_hub==2.2.0
          - lxml==6.1.3
          - beautifulsoup4==4.14.3
          - sqlparse==0.5.3
      tasks:
      - task_key: setup
        spark_python_task:
          python_file: ../src/sql/common/launch.py
          source: WORKSPACE
          parameters:
          - --repo-root
          - ${workspace.file_path}
          - --entry-point
          - src/sql/common/run_sql.py
          - --catalog
          - ${var.catalog}
          - --source-volume
          - ${var.source_volume}
          - --batch-id
          - '{{job.run_id}}'
          - --file
          - src/sql/00_setup/00_catalog_schema_setup.sql
        environment_key: pipeline
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 30000
        retry_on_timeout: false
      permissions:
      - user_name: ${var.run_as_user}
        level: CAN_MANAGE
