resources:
  jobs:
    pipeline:
      name: ahon_pipeline
      description: AHON bounded batch processing; see source-to-target matrix
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 14400
      performance_target: STANDARD
      tags:
        project: ahon
        aidevkit_project: ai-dev-kit
      environments:
      - environment_key: pipeline
        spec:
          environment_version: '6'
          dependencies:
          - openpyxl==3.1.5
          - pandas==2.3.3
          - requests==2.32.5
          - huggingface_hub==2.2.0
          - lxml==6.1.3
          - beautifulsoup4==4.14.3
          - sqlparse==0.5.3
      tasks:
      - task_key: setup
        run_job_task:
          job_id: ${resources.jobs.setup.id}
        timeout_seconds: 14400
        max_retries: 0
      - task_key: psgc
        run_job_task:
          job_id: ${resources.jobs.psgc.id}
        timeout_seconds: 14400
        max_retries: 0
        depends_on:
        - task_key: setup
      - task_key: ldrrmf
        run_job_task:
          job_id: ${resources.jobs.ldrrmf.id}
        timeout_seconds: 14400
        max_retries: 0
        depends_on:
        - task_key: psgc
      - task_key: population
        run_job_task:
          job_id: ${resources.jobs.population.id}
        timeout_seconds: 14400
        max_retries: 0
        depends_on:
        - task_key: psgc
      - task_key: earthquake
        run_job_task:
          job_id: ${resources.jobs.earthquake.id}
        timeout_seconds: 14400
        max_retries: 0
        depends_on:
        - task_key: psgc
      - task_key: cmci
        run_job_task:
          job_id: ${resources.jobs.cmci.id}
        timeout_seconds: 14400
        max_retries: 0
        depends_on:
        - task_key: psgc
      - task_key: evidence
        run_job_task:
          job_id: ${resources.jobs.evidence.id}
        timeout_seconds: 14400
        max_retries: 0
        depends_on:
        - task_key: ldrrmf
        - task_key: population
        - task_key: cmci
      permissions:
      - user_name: ${var.run_as_user}
        level: CAN_MANAGE
