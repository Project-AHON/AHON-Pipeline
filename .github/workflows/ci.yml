---
name: CI

"on":
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - edited
      - synchronize
      - reopened

  push:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Validate documentation update
      - name: Validate documentation update
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]

          changed_files = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--name-only",
                  "--diff-filter=AM",
                  base_sha,
                  head_sha,
              ],
              text=True,
          ).splitlines()

          documentation_files = [
              file
              for file in changed_files
              if file.lower().endswith(".md")
          ]

          if documentation_files:
              print("Documentation files updated:")
              for file in documentation_files:
                  print(f"- {file}")
          else:
              print(
                  "ERROR: This PR must add or update at least "
                  "one Markdown documentation file."
              )
              print(
                  "Update an existing .md file or add a new one "
                  "before merging."
              )
              sys.exit(1)
          PY

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      # 5. Validate YAML files
      - name: Validate YAML files
        run: |
          pip install yamllint
          yamllint -f parsable .

      # 6. Lint Python files
      - name: Lint Python files
        run: |
          pip install ruff
          ruff check .

      # 7. Run tests
      - name: Run tests
        run: |
          pip install pytest

          if find tests -type f -name 'test_*.py' -print -quit |
            grep -q .
          then
            pytest tests -q
          else
            echo "No test files found. Skipping tests."
          fi
