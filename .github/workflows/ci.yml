---
name: CI

"on":
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - edited
      - synchronize
      - reopened

  push:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{
      github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Validate PR Markdown file
      - name: Validate PR Markdown file
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          title = os.environ["PR_TITLE"]
          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]

          expected_file = f"{title}.md"

          changed_files = subprocess.check_output(
              [
                  "git", "diff", "--name-only", "--diff-filter=AM",
                  base_sha, head_sha
              ],
              text=True,
          ).splitlines()

          # Match the filename regardless of its folder
          matching_files = [
              file for file in changed_files
              if file.endswith(".md")
              and file.rsplit("/", 1)[-1] == expected_file
          ]

          if matching_files:
              print(f"Markdown file found: {matching_files[0]}")
          else:
              print(f"ERROR: Missing required file: {expected_file}")
              print(
                  "Please add or update a Markdown file "
                  "matching your PR title."
              )
              sys.exit(1)
          PY

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      # 5. Validate YAML files
      - name: Validate YAML files
        run: |
          pip install yamllint
          yamllint -f parsable .

      # 6. Lint Python files
      - name: Lint Python files
        run: |
          pip install ruff
          ruff check .

      # 7. Run tests
      - name: Run tests
        run: |
          pip install pytest

          if find tests -type f -name 'test_*.py' -print -quit |
            grep -q .
          then
            pytest tests -q
          else
            echo "No test files found. Skipping tests."
          fi
